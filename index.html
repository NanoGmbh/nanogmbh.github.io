<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoGmbH Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
    <style>
        body{margin:0;font-family:Inter;background:#020617;color:white}
        header{display:flex;justify-content:space-between;padding:20px 50px}
        nav a{margin-left:20px;color:#cbd5e1;text-decoration:none}
        .hero{padding:80px;text-align:center}
        .btn{padding:12px 25px;background:#3b82f6;border:none;border-radius:10px;color:white;cursor:pointer}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;padding:40px}
        .card{background:#0f172a;padding:20px;border-radius:15px;transition:transform 0.3s}
        .card:hover{transform:translateY(-5px)}
        .card img{width:100%;height:200px;object-fit:cover;border-radius:10px;margin-bottom:15px}
        .card h3{margin:10px 0;color:#60a5fa}
        .card p{color:#94a3b8;font-size:14px}
        input{display:block;width:100%;margin:10px 0;padding:10px;background:#020617;border:1px solid #1e293b;border-radius:8px;color:white}
        #adminPanel{display:none;padding:20px;background:#0f172a;margin:20px;border-radius:15px}
        .logout-btn{background:#ef4444;margin-left:10px}
    </style>
</head>
<body>
    <header>
        <h2>NanoGmbH</h2>
        <nav>
            <a href="#">Home</a>
            <a href="#" onclick="showLogin()">Login</a>
            <a href="#" id="logoutBtn" onclick="logout()" style="display:none">Logout</a>
        </nav>
    </header>
    
    <section class="hero">
        <h1>NanoGmbH Plattform</h1>
        <p>Mit Login, Datenbank & echten Projekten</p>
    </section>

    <div id="loginBox" style="display:none;padding:20px;max-width:400px;margin:0 auto;background:#0f172a;border-radius:15px">
        <h3>Login</h3>
        <input id="email" placeholder="Email">
        <input id="password" type="password" placeholder="Passwort">
        <button class="btn" onclick="login()">Login</button>
        <button class="btn" onclick="register()">Registrieren</button>
    </div>

    <div id="adminPanel">
        <h3>Admin Panel - Projekt hinzufügen</h3>
        <input id="pname" placeholder="Projekt Name (z.B. Nano-AI)">
        <input id="pdesc" placeholder="Beschreibung">
        <input id="plink" placeholder="Link (https://...)">
        <input id="pimage" placeholder="Bildname (z.B. Nano-AI.png)">
        <button class="btn" onclick="addProduct()">Hinzufügen</button>
    </div>

    <div class="grid" id="products"></div>

    <script>
        // 🔥 FIREBASE CONFIG (HIER DEINE DATEN EINTRAGEN)
        const firebaseConfig = {
            apiKey: "YOUR_KEY",
            authDomain: "YOUR_DOMAIN",
            projectId: "YOUR_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function showLogin(){
            document.getElementById('loginBox').style.display='block';
        }

        function register(){
            let email = document.getElementById('email').value;
            let pw = document.getElementById('password').value;
            auth.createUserWithEmailAndPassword(email,pw)
                .then(() => alert("Registrierung erfolgreich!"))
                .catch(err => alert("Fehler: " + err.message));
        }

        function login(){
            let email = document.getElementById('email').value;
            let pw = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email,pw)
                .then(() => {
                    document.getElementById('loginBox').style.display='none';
                })
                .catch(err => alert("Fehler: " + err.message));
        }

        function logout(){
            auth.signOut();
        }

        auth.onAuthStateChanged(user=>{
            if(user){
                document.getElementById('adminPanel').style.display='block';
                document.getElementById('logoutBtn').style.display='inline';
            } else {
                document.getElementById('adminPanel').style.display='none';
                document.getElementById('logoutBtn').style.display='none';
            }
        });

        function addProduct(){
            let name = document.getElementById('pname').value;
            let desc = document.getElementById('pdesc').value;
            let link = document.getElementById('plink').value;
            let image = document.getElementById('pimage').value;
            
            if(!name || !desc || !link){
                alert("Bitte alle Felder ausfüllen!");
                return;
            }
            
            // Wenn kein Bild angegeben, Standardbild verwenden
            if(!image) image = "default.png";
            
            db.collection("products").add({
                name,
                desc,
                link,
                image,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => {
                alert("Projekt hinzugefügt!");
                // Felder leeren
                document.getElementById('pname').value = '';
                document.getElementById('pdesc').value = '';
                document.getElementById('plink').value = '';
                document.getElementById('pimage').value = '';
            });
        }

        function loadProducts(){
            db.collection("products").orderBy("timestamp", "desc").onSnapshot(snapshot=>{
                let el = document.getElementById('products');
                el.innerHTML='';
                
                snapshot.forEach(doc=>{
                    let p = doc.data();
                    // Bildpfad anpassen - hier wird angenommen, dass Bilder im Ordner "images/" liegen
                    let imgPath = p.image ? `images/${p.image}` : 'images/default.png';
                    
                    el.innerHTML += `
                        <div class="card">
                            <img src="${imgPath}" alt="${p.name}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect fill=%22%233b82f6%22 width=%22200%22 height=%22200%22/><text fill=%22white%22 x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22>Nano</text></svg>'">
                            <h3>${p.name}</h3>
                            <p>${p.desc}</p>
                            <button class="btn" onclick="window.open('${p.link}', '_blank')">Projekt öffnen</button>
                        </div>
                    `;
                });
            });
        }

        loadProducts();
    </script>
</body>
</html>
