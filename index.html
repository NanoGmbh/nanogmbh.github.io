<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NanoGmbH Projekte</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Inter;background:#020617;color:white;line-height:1.6}
        
        header{
            display:flex;justify-content:center;align-items:center;
            padding:20px 40px;background:rgba(15,23,42,0.8);
            position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)
        }
        header h1{font-size:1.5rem;color:#60a5fa}
        
        .hero{
            text-align:center;padding:80px 20px;
            background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%)
        }
        .hero h2{font-size:2.5rem;margin-bottom:15px}
        .hero p{color:#94a3b8;max-width:600px;margin:0 auto}
        
        .grid{
            display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:30px;padding:40px;max-width:1400px;margin:0 auto
        }
        
        .card{
            background:#0f172a;border-radius:20px;overflow:hidden;
            transition:transform 0.3s,box-shadow 0.3s;border:1px solid #1e293b
        }
        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 20px 40px rgba(59,130,246,0.2)
        }
        
        .card-img{
            width:100%;height:200px;object-fit:cover;
            background:linear-gradient(135deg,#3b82f6,#8b5cf6)
        }
        
        .card-content{padding:25px}
        .card h3{color:#60a5fa;margin-bottom:10px;font-size:1.3rem}
        .card p{color:#94a3b8;font-size:0.95rem;margin-bottom:20px}
        
        .btn{
            display:inline-block;padding:12px 30px;
            background:#3b82f6;color:white;text-decoration:none;
            border-radius:10px;font-weight:500;transition:background 0.3s;
            border:none;cursor:pointer;font-size:1rem
        }
        .btn:hover{background:#2563eb}
        
        footer{
            text-align:center;padding:30px;color:#64748b;
            border-top:1px solid #1e293b;margin-top:40px
        }
        
        .img-placeholder{
            width:100%;height:200px;display:flex;
            align-items:center;justify-content:center;
            background:linear-gradient(135deg,#3b82f6,#8b5cf6);
            color:white;font-weight:600;font-size:1.2rem
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ NanoGmbH</h1>
    </header>

    <section class="hero">
        <h2>Unsere Projekte</h2>
        <p>Entdecke innovative Lösungen aus dem Nano-Universum – von KI bis Cloud-Infrastruktur.</p>
    </section>

    <div class="grid" id="projectsGrid"></div>

    <footer>
        <p>© 2026 NanoGmbH • Alle Projekte sind Open Source</p>
    </footer>

    <script>
        // 📦 DEINE PROJEKTE
        const projects = [
            {
                name: "NanoAI",
                desc: "Eine leichte, lokale KI ähnlich wie ChatGPT – perfekt für Einsteiger.",
                link: "https://github.com/deinname/NanoAI",
                image: "NanoAI.png"
            },
            {
                name: "Nano-Chat",
                desc: "Moderner Chat mit Echtzeit-Nachrichten und End-to-End Verschlüsselung.",
                link: "https://github.com/deinname/Nano-Chat",
                image: "Nano-Chat.png"
            },
            {
                name: "Nano-Cloud",
                desc: "Deine private Cloud-Lösung mit automatischem Backup & Sync.",
                link: "https://github.com/deinname/Nano-Cloud",
                image: "Nano-Cloud.png"
            },
            {
                name: "Nano-Host",
                desc: "Schnelles Webhosting mit SSL, CDN und 99.9% Uptime Garantie.",
                link: "https://github.com/deinname/Nano-Host",
                image: "Nano-Host.png"
            }
        ];

        function loadProjects(){
            const grid = document.getElementById('projectsGrid');
            
            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const imgSrc = project.image;
                const imgHTML = `<img src="${imgSrc}" alt="${project.name}" class="card-img" 
                    onerror="this.replaceWith(createPlaceholder('${project.name}'))">`;
                
                card.innerHTML = `
                    ${imgHTML}
                    <div class="card-content">
                        <h3>${project.name}</h3>
                        <p>${project.name}</p>
                        <a href="${project.link}" target="_blank" class="btn">Projekt ansehen →</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function createPlaceholder(name){
            const placeholder = document.createElement('div');
            placeholder.className = 'img-placeholder';
            placeholder.textContent = name;
            return placeholder;
        }

        document.addEventListener('DOMContentLoaded', loadProjects);
    </script>

</body>
</html>
